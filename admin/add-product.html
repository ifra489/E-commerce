<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Product</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    .btn {
      display: flex !important;
      flex-direction: column !important;
    }
    .btn-secondary {
      background-color: rgb(65, 64, 64) !important;
    }
    .btn-secondary:hover {
      background-color: rgb(119, 119, 119) !important;
    }
    .btn-success {
      background-color: rgb(3, 3, 80) !important;
      border: 1px solid blue !important;
    }
  </style>
</head>
<body>
  <div class="container mt-4">
    <h2 id="formTitle" style="color: rgb(13, 13, 90) !important;">Add Product</h2>

    <form id="productForm">
      <div class="mb-3">
        <label class="form-label">Title</label>
        <input type="text" class="form-control" id="name" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Price</label>
        <input type="number" class="form-control" id="price" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Stock Quantity</label>
        <input type="number" class="form-control" id="stock" required />
      </div>

      <!-- ✅ In Stock option -->
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="inStock" checked />
        <label for="inStock" class="form-check-label">In Stock</label>
      </div>

      <!-- ✅ Category dropdown -->
      <div class="mb-3">
        <label class="form-label">Category</label>
        <select id="categorySelect" class="form-select"></select>
      </div>

      <!-- ✅ Add new category -->
      <div class="mb-3">
        <input type="text" class="form-control mb-2" id="newCategory" placeholder="Add new category" />
        <button type="button" class="btn btn-secondary" onclick="addNewCategory()">+ Add Category</button>
      </div>

      <!-- ✅ Images -->
      <div class="mb-3" id="imagesContainer">
        <label class="form-label">Image URL</label>
        <input type="text" class="form-control mb-2" name="image" placeholder="Enter image URL" />
      </div>
      <button type="button" class="btn btn-secondary mb-3" onclick="addImageField()">+ Add More Images</button>

      <button type="submit" class="btn btn-success">Save</button>
    </form>
  </div>

  <script src="js/add-product.js"></script>
</body>
</html>
