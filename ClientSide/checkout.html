<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f5f7fa;
      font-family: 'Poppins', sans-serif;
    }
    .checkout-card {
      max-width: 550px;
      margin: 40px auto;
      padding: 30px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .checkout-card h2 {
      text-align: center;
      color: #1a237e;
      margin-bottom: 25px;
      font-weight: 700;
    }
    .form-label {
      font-weight: 600;
    }
    .form-control:focus {
      border-color: #1a237e;
      box-shadow: 0 0 0 0.2rem rgba(26,35,126,.25);
    }
    .btn-primary {
      background-color: #1a237e;
      border: none;
      font-weight: 600;
    }
    .btn-primary:hover {
      background-color: #0d1957;
    }
    .btn-secondary {
      background-color: #f5f5f5;
      color: #333;
      border: none;
      font-weight: 600;
    }
    .btn-secondary:hover {
      background-color: #e0e0e0;
    }
    #transactionField, #cardField {
      display: none;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="checkout-card">
    <h2>Checkout</h2>
    <form id="checkoutForm">
      <!-- Personal Info -->
      <div class="mb-3">
        <label for="fullname" class="form-label">Full Name</label>
        <input type="text" id="fullname" class="form-control" placeholder="Enter your full name" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
      </div>
      <div class="mb-3">
        <label for="contact" class="form-label">Contact Number</label>
        <input type="tel" id="contact" class="form-control" placeholder="03XXXXXXXXX" required>
      </div>

      <!-- Delivery Info -->
      <div class="mb-3">
        <label for="address" class="form-label">Address</label>
        <textarea id="address" class="form-control" rows="2" placeholder="Enter your address" required></textarea>
      </div>
      <div class="mb-3">
        <label for="city" class="form-label">City</label>
        <input type="text" id="city" class="form-control" placeholder="Enter your city" required>
      </div>
      <div class="mb-3">
        <label for="place" class="form-label">Famous Place (Nearby Landmark)</label>
        <input type="text" id="place" class="form-control" placeholder="Enter nearby landmark">
      </div>

      <!-- Payment Method -->
      <div class="mb-3">
        <label class="form-label">Payment Method</label>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="payment" value="cod" checked>
          <label class="form-check-label">Cash on Delivery</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="payment" value="easypaisa">
          <label class="form-check-label">Easypaisa / JazzCash</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="payment" value="card">
          <label class="form-check-label">Debit / Credit Card</label>
        </div>
      </div>

      <!-- Transaction ID field -->
      <div id="transactionField">
        <label class="form-label">Transaction ID</label>
        <input type="text" id="transactionId" class="form-control" placeholder="Enter your transaction ID">
      </div>

      <!-- Card Payment fields -->
      <div id="cardField">
        <label class="form-label">Card Number</label>
        <input type="text" id="cardNumber" class="form-control" placeholder="1234 5678 9012 3456" >
        
        <label class="form-label">Expiry Date</label>
        <input type="month" id="expiryDate"  name="expiry" min="2025-09" class="form-control" placeholder="MM/YY" >
        
        <label class="form-label">CVV</label>
        <input type="password" id="cvv" class="form-control" placeholder="123">
      </div>

      <!-- Buttons -->
      <div class="d-flex justify-content-between mt-4">
        <button type="submit" class="btn btn-primary w-50 me-2">Place Order</button>
        <button type="button" class="btn btn-secondary w-50" id="cancelBtn">Cancel</button>
      </div>
    </form>
  </div>

  <script>
    // ✅ Show/Hide payment fields
    document.querySelectorAll("input[name='payment']").forEach(input => {
      input.addEventListener("change", function() {
        const transactionField = document.getElementById("transactionField");
        const cardField = document.getElementById("cardField");

        if (this.value === "easypaisa") {
          transactionField.style.display = "block";
          cardField.style.display = "none";
        } 
        else if (this.value === "card") {
          cardField.style.display = "block";
          transactionField.style.display = "none";
        } 
        else {
          transactionField.style.display = "none";
          cardField.style.display = "none";
        }
      });
    });
  </script>

  <script src="js/checkout.js"></script>
</body>
</html>
