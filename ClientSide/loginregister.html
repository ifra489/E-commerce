



 <!DOCTYPE html>  
<html lang="en">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>Login / Register</title>  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">  
  <style>  
    body {  
      display: flex;  
      justify-content: center;  
      align-items: center;  
      height: 100vh;  
      background: #f4f6f9;  
    }  
    .card {  
      width: 400px;  
      border-radius: 12px;  
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);  
    }  
    .nav-tabs .nav-link.active {  
      font-weight: bold;  
      background: #f8f9fa;  
    }  
    .btn-danger {  
      background-color: rgb(10, 10, 119);  
      border: 1px solid blue;  
    }  
    .btn-danger:hover {  
      background-color: rgb(12, 80, 206);  
      border: 1px solid blue;  
    }  
  </style>  
</head>  
<body>  
  
<div class="card p-3">  
  <ul class="nav nav-tabs mb-3" id="authTabs" role="tablist">  
    <li class="nav-item">  
      <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button">Login</button>  
    </li>  
    <li class="nav-item">  
      <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button">Register</button>  
    </li>  
  </ul>  
  
  <div class="tab-content" id="authTabsContent">  
    <!-- Login -->  
    <div class="tab-pane fade show active" id="login">  
      <form id="loginForm">  
        <div class="mb-3">  
          <input type="email" class="form-control" id="loginEmail" placeholder="Email" required>  
        </div>  
        <div class="mb-3">  
          <input type="password" class="form-control" id="loginPassword" placeholder="Password" required>  
        </div>  
        <button type="submit" class="btn btn-primary w-100">Login</button>  
      </form>  
      <div class="mt-3 text-center">  
        <a href="http://localhost:5000/auth/google" class="btn btn-danger w-100">Login with Google</a>  
      </div>  
    </div>  
  
    <!-- Register -->  
    <div class="tab-pane fade" id="register">  
      <form id="registerForm">  
        <div class="mb-3">  
          <input type="text" class="form-control" id="registerName" placeholder="Name" required>  
        </div>  
        <div class="mb-3">  
          <input type="email" class="form-control" id="registerEmail" placeholder="Email" required>  
        </div>  
        <div class="mb-3">  
          <input type="password" class="form-control" id="registerPassword" placeholder="Password" required>  
        </div>  
        <button type="submit" class="btn btn-success w-100">Register</button>  
      </form>  
      <div class="mt-3 text-center">  
        <a href="http://localhost:5000/auth/google" class="btn btn-danger w-100">Register with Google</a>  
      </div>  
    </div>  
  </div>  
</div>  
  
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>  
<script>  
const API_URL = "http://localhost:5000/api/auth";  

// ✅ Helper: redirect user after login/register
function redirectAfterLogin() {  
  const redirectTo = localStorage.getItem("redirectAfterLogin") || "index.html";  
  localStorage.removeItem("redirectAfterLogin");  
  window.location.href = redirectTo;  
}  

// ✅ Normal Login  
document.getElementById("loginForm").addEventListener("submit", async (e) => {  
  e.preventDefault();  
  const email = document.getElementById("loginEmail").value;  
  const password = document.getElementById("loginPassword").value;  
  
  const res = await fetch(`${API_URL}/login`, {  
    method: "POST",  
    headers: { "Content-Type": "application/json" },  
    body: JSON.stringify({ email, password })  
  });  
  
  const data = await res.json();  
  if (res.ok) {  
    localStorage.setItem("accessToken", data.accessToken);  
    localStorage.setItem("refreshToken", data.refreshToken);  
    localStorage.setItem("email", data.email);  
    redirectAfterLogin();  
  } else {  
    alert("❌ " + data.message);  
  }  
});  
  
// ✅ Registration  
document.getElementById("registerForm").addEventListener("submit", async (e) => {  
  e.preventDefault();  
  const name = document.getElementById("registerName").value;  
  const email = document.getElementById("registerEmail").value;  
  const password = document.getElementById("registerPassword").value;  
  
  const res = await fetch(`${API_URL}/register`, {  
    method: "POST",  
    headers: { "Content-Type": "application/json" },  
    body: JSON.stringify({ name, email, password })  
  });  
  
  const data = await res.json();  
  if (res.ok) {  
    alert("✅ Registration successful, please login");  
    const loginTab = new bootstrap.Tab(document.getElementById('login-tab'));  
    loginTab.show();  
  } else {  
    alert("❌ " + data.message);  
  }  
});  
  
// ✅ Handle Google login redirect with tokens  
const urlParams = new URLSearchParams(window.location.search);  
const accessToken = urlParams.get("accessToken");  
const refreshToken = urlParams.get("refreshToken");  
if (accessToken&refreshToken) {  
  localStorage.setItem("accessToken", accessToken);  
  localStorage.setItem("refreshToken", refreshToken);  
  window.history.replaceState({}.document.title,"loginregister.html");
  redirectAfterLogin();
}  
</script>  
</body>  
</html>
